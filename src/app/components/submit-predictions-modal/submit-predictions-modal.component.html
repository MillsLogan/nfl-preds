<div class="modal fade" id="submitModal" tabindex="-1" aria-labelledby="submitModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="submitModalLabel">Submit Your Predictions</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form>
          <div class="mb-3">
            <label for="recipient-name" class="col-form-label">Enter Your Name</label>
            <input type="text" name="playerNameInput" class="form-control" id="recipient-name" [(ngModel)]="playerName" (ngModelChange)="nameChanged(playerName)">
          </div>
          <div class="mb-3" [ngStyle]="{'display': showColor ? 'block' : 'none'}">
            <label for="color-select" class="col-form-label">Select Your Favorite Color</label>
            <input type="color" name="color-selection-input" class="form-control form-control-color" id="color-select" [(ngModel)]="colorSelection">
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary" (click)="submitCallback(playerName, colorSelection)" [ngClass]="readyToSubmit ? '' : 'disabled'">Submit Predictions</button>
      </div>
    </div>
  </div>
</div>
