<div class="container">
    <div class="row mt-1">
        <div class="col-12">
            <img [src]="'assets/' + teamLogo" alt="{{ teamName }} logo" class="img-fluid team-logo">
            <h1 class="display-4">{{ teamName }}</h1>
            <p class="lead">{{ wins }} - {{ losses }}</p>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-5 table-responsive">
            <app-team-leaderboard [teamName]="teamName" [teamSchedule]="teamSchedule"></app-team-leaderboard>
        </div>
        <div class="col-lg-7 scrollable">
            <app-games-list [title]="'Schedule'" [games]="teamSchedule" [addByeWeek]="true"></app-games-list>
        </div>
    </div>
</div>
